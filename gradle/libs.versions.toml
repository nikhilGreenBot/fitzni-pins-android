[versions]
agp                          = "8.4.2"
kotlin                       = "2.0.0"
ksp                          = "2.0.0-1.0.21"
coreKtx                      = "1.13.1"
lifecycleRuntimeKtx          = "2.8.3"
activityCompose              = "1.9.0"
composeBom                   = "2024.06.00"
navigationCompose            = "2.7.7"
hilt                         = "2.51.1"
hiltNavigationCompose        = "1.2.0"
room                         = "2.6.1"
datastore                    = "1.1.2"
retrofit                     = "2.11.0"
okhttp                       = "4.12.0"
kotlinxSerializationJson     = "1.7.1"
retrofitKotlinxSerialization = "1.0.0"
coil                         = "3.0.0-rc01"
coreSplashscreen             = "1.0.1"
timber                       = "5.0.1"
turbine                      = "1.1.0"
junit5                       = "5.10.3"
espressoCore                 = "3.6.1"
composeUiTestJunit4          = "1.6.8"
mockk                        = "1.13.11"
kotlinxCoroutinesTest        = "1.8.1"
accompanistPermissions       = "0.34.0"
cameraX                      = "1.3.4"
lottie                       = "6.4.1"

[libraries]
# AndroidX Core
androidx-core-ktx                    = { group = "androidx.core",             name = "core-ktx",                                    version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx       = { group = "androidx.lifecycle",        name = "lifecycle-runtime-ktx",                       version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle",        name = "lifecycle-viewmodel-compose",                 version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose   = { group = "androidx.lifecycle",        name = "lifecycle-runtime-compose",                   version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose            = { group = "androidx.activity",         name = "activity-compose",                            version.ref = "activityCompose" }
androidx-core-splashscreen           = { group = "androidx.core",             name = "core-splashscreen",                           version.ref = "coreSplashscreen" }

# Compose BOM
androidx-compose-bom                 = { group = "androidx.compose",          name = "compose-bom",                                 version.ref = "composeBom" }
androidx-ui                          = { group = "androidx.compose.ui",       name = "ui" }
androidx-ui-graphics                 = { group = "androidx.compose.ui",       name = "ui-graphics" }
androidx-ui-tooling-preview          = { group = "androidx.compose.ui",       name = "ui-tooling-preview" }
androidx-ui-tooling                  = { group = "androidx.compose.ui",       name = "ui-tooling" }
androidx-material3                   = { group = "androidx.compose.material3",name = "material3" }
androidx-material-icons-extended     = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-compose-animation           = { group = "androidx.compose.animation",name = "animation" }

# Navigation
androidx-navigation-compose          = { group = "androidx.navigation",       name = "navigation-compose",                          version.ref = "navigationCompose" }

# Hilt
hilt-android                         = { group = "com.google.dagger",         name = "hilt-android",                                version.ref = "hilt" }
hilt-android-compiler                = { group = "com.google.dagger",         name = "hilt-android-compiler",                       version.ref = "hilt" }
hilt-navigation-compose              = { group = "androidx.hilt",             name = "hilt-navigation-compose",                     version.ref = "hiltNavigationCompose" }

# Room
androidx-room-runtime                = { group = "androidx.room",             name = "room-runtime",                                version.ref = "room" }
androidx-room-ktx                    = { group = "androidx.room",             name = "room-ktx",                                    version.ref = "room" }
androidx-room-compiler               = { group = "androidx.room",             name = "room-compiler",                               version.ref = "room" }

# DataStore
androidx-datastore-preferences       = { group = "androidx.datastore",        name = "datastore-preferences",                       version.ref = "datastore" }

# Retrofit + Serialization
retrofit                             = { group = "com.squareup.retrofit2",    name = "retrofit",                                    version.ref = "retrofit" }
retrofit-kotlinx-serialization       = { group = "com.jakewharton.retrofit",  name = "retrofit2-kotlinx-serialization-converter",   version.ref = "retrofitKotlinxSerialization" }
okhttp                               = { group = "com.squareup.okhttp3",      name = "okhttp",                                      version.ref = "okhttp" }
okhttp-logging-interceptor           = { group = "com.squareup.okhttp3",      name = "logging-interceptor",                         version.ref = "okhttp" }
kotlinx-serialization-json           = { group = "org.jetbrains.kotlinx",     name = "kotlinx-serialization-json",                  version.ref = "kotlinxSerializationJson" }

# Coil
coil-compose                         = { group = "io.coil-kt.coil3",          name = "coil-compose",                                version.ref = "coil" }
coil-network-okhttp                  = { group = "io.coil-kt.coil3",          name = "coil-network-okhttp",                         version.ref = "coil" }

# Camera
androidx-camera-core                 = { group = "androidx.camera",           name = "camera-core",                                 version.ref = "cameraX" }
androidx-camera-camera2              = { group = "androidx.camera",           name = "camera-camera2",                              version.ref = "cameraX" }
androidx-camera-lifecycle            = { group = "androidx.camera",           name = "camera-lifecycle",                            version.ref = "cameraX" }
androidx-camera-view                 = { group = "androidx.camera",           name = "camera-view",                                 version.ref = "cameraX" }

# Lottie
lottie-compose                       = { group = "com.airbnb.android",        name = "lottie-compose",                              version.ref = "lottie" }

# Permissions
accompanist-permissions              = { group = "com.google.accompanist",    name = "accompanist-permissions",                     version.ref = "accompanistPermissions" }

# Timber
timber                               = { group = "com.jakewharton.timber",    name = "timber",                                      version.ref = "timber" }

# Testing
junit-jupiter-api                    = { group = "org.junit.jupiter",         name = "junit-jupiter-api",                           version.ref = "junit5" }
junit-jupiter-engine                 = { group = "org.junit.jupiter",         name = "junit-jupiter-engine",                        version.ref = "junit5" }
turbine                              = { group = "app.cash.turbine",          name = "turbine",                                     version.ref = "turbine" }
mockk                                = { group = "io.mockk",                  name = "mockk",                                       version.ref = "mockk" }
kotlinx-coroutines-test              = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-test",                     version.ref = "kotlinxCoroutinesTest" }
androidx-test-espresso-core          = { group = "androidx.test.espresso",    name = "espresso-core",                               version.ref = "espressoCore" }
androidx-compose-ui-test-junit4      = { group = "androidx.compose.ui",       name = "ui-test-junit4",                              version.ref = "composeUiTestJunit4" }
androidx-compose-ui-test-manifest    = { group = "androidx.compose.ui",       name = "ui-test-manifest" }

[plugins]
android-application  = { id = "com.android.application",                   version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",              version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",       version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                  = { id = "com.google.devtools.ksp",                    version.ref = "ksp" }
hilt-android         = { id = "com.google.dagger.hilt.android",            version.ref = "hilt" }
